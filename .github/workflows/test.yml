name: Tests

on:
  push:
    branches: [master, setup-testing]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Type check (library, type tests, benchmarks)
        run: yarn typecheck

      - name: Type-check the code blocks of the docs and the README
        run: yarn test:docs-code

      - name: Run tests
        run: yarn test:run

      - name: Run tests under the React Compiler
        run: yarn test:compiler

      - name: Build the package
        run: yarn build

      # The library must ship uncompiled: the React Compiler is applied to the examples only
      - name: Check the package is not compiled by the React Compiler
        run: |
          if grep -rl memo_cache_sentinel dist; then echo "dist contains React Compiler output"; exit 1; fi

      - name: Run the React Compiler tests against the package
        run: yarn test:dist

      # skipLibCheck off, bundler / node10 / node16 / nodenext, ESM and CommonJS consumers
      - name: Type-check the package as apps import it
        run: yarn test:package-types
      
      - name: Generate coverage
        run: yarn test:coverage
        if: matrix.node-version == '20.x'
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.node-version == '20.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        # an outage at Codecov must not fail the tests
        continue-on-error: true

  # react >= 18 is the peer range; the job above runs React 19
  react-18:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The lockfile changes in this job only. The React Compiler tests are left out: they target React 19.
      - name: Switch to React 18
        run: yarn add -D react@^18.3.1 react-dom@^18.3.1
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Run tests on React 18
        run: |
          node -p "'react ' + require('react/package.json').version"
          yarn test:run
