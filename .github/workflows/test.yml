name: Tests

on:
  push:
    branches: [master, setup-testing]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Type check (library, type tests, benchmarks)
        run: yarn typecheck

      - name: Run tests
        run: yarn test:run

      - name: Run tests under the React Compiler
        run: yarn test:compiler

      - name: Build the package
        run: yarn build

      # The library must ship uncompiled: the React Compiler is applied to the examples only
      - name: Check the package is not compiled by the React Compiler
        run: |
          if grep -rl memo_cache_sentinel dist; then echo "dist contains React Compiler output"; exit 1; fi

      - name: Run the React Compiler tests against the package
        run: yarn test:dist
      
      - name: Generate coverage
        run: yarn test:coverage
        if: matrix.node-version == '20.x'
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
