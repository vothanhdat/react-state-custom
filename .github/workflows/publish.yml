name: Publish to npm

# Runs when a version tag is pushed (git push origin v1.2.0) or manually from the Actions tab.
# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere. One-time setup on npmjs.com:
#   package "react-state-custom" -> Settings -> Trusted Publisher -> GitHub Actions
#   owner: vothanhdat, repository: react-state-custom, workflow filename: publish.yml, environment: (blank)
#   Allowed actions: tick "npm publish" (a new publisher only gets "stage publish" by default -> 403)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          test "$PKG" = "$GITHUB_REF_NAME" || { echo "package.json is $PKG but tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      # prepublishOnly runs `yarn build`. --provenance attaches a signed build attestation.
      - name: Publish
        run: npm publish --provenance --access public
